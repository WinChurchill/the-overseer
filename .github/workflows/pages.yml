name: Publish approved website
on:
  workflow_dispatch:
    inputs:
      publication_approved:
        description: Owner has approved making this website public
        type: boolean
        default: false
        required: true
      version:
        description: Exact approved release version (no v prefix)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  build:
    if: inputs.publication_approved && !github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build approved public identity
        env:
          SITE_URL: ${{ vars.OVERSEER_SITE_URL }}
          REPOSITORY_URL: ${{ vars.OVERSEER_REPOSITORY_URL }}
          DOWNLOAD_URL: ${{ vars.OVERSEER_DOWNLOAD_URL }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/Build-Site.mjs "--base-url=$SITE_URL" "--repository-url=$REPOSITORY_URL" "--download-url=$DOWNLOAD_URL" "--version=$RELEASE_VERSION"
      - name: Validate public metadata and links
        run: node scripts/Check-Site.mjs --publication
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
